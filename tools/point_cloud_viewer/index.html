<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点群ビューア</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; font-family: 'Inter', sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; display: block; }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 8px solid #f3f3f3; /* Light grey */
            border-top: 8px solid #3498db; /* Blue */
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            z-index: 100;
            display: none; /* Initially hidden */
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
        /* Custom modal for alerts */
        .custom-modal {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .custom-modal.show {
            opacity: 1;
            visibility: visible;
        }
        .custom-modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 400px;
        }
        .custom-modal-content h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #333;
        }
        .custom-modal-content p {
            margin-bottom: 20px;
            color: #555;
        }
        .custom-modal-content button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .custom-modal-content button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body class="bg-gray-900 text-white">
    <div id="container"></div>

    <div id="loader"></div>

    <div id="customAlert" class="custom-modal">
        <div class="custom-modal-content bg-gray-800 text-white rounded-lg">
            <h2 id="customAlertTitle" class="text-xl font-semibold mb-2">通知</h2>
            <p id="customAlertMessage" class="mb-4">メッセージ</p>
            <button id="customAlertClose" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">閉じる</button>
        </div>
    </div>

    <div class="absolute top-0 left-0 p-4 space-y-2 bg-gray-800 bg-opacity-80 rounded-br-lg shadow-lg max-w-xs md:max-w-sm">
        <div>
            <label for="fileInput" class="block text-sm font-medium text-gray-300">.bin ファイルを選択:</label>
            <input type="file" id="fileInput" accept=".bin" class="mt-1 block w-full text-sm text-gray-400
                file:mr-4 file:py-2 file:px-4
                file:rounded-md file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-500 file:text-white
                hover:file:bg-blue-600 cursor-pointer"/>
        </div>
         <p class="text-xs text-gray-400 mt-1">座標系: X:奥(赤), Y:左(緑), Z:上(青)</p>
        <div id="pointCount" class="text-sm text-gray-300">点群数: 0 (表示中: 0)</div>
        <div class="flex items-center space-x-2">
            <label for="pointSize" class="block text-sm font-medium text-gray-300">点のサイズ:</label>
            <input type="range" id="pointSize" min="0.01" max="0.50" step="0.01" value="0.05" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">
            <span id="pointSizeValue" class="text-sm text-gray-300 w-10 text-right">0.05</span>
        </div>

        <div class="space-y-1 pt-2 border-t border-gray-700">
            <label class="block text-sm font-medium text-gray-300">強度フィルタ:</label>
            <div class="flex items-center space-x-2">
                <label for="minIntensitySlider" class="text-xs text-gray-400 w-10">最小:</label>
                <input type="range" id="minIntensitySlider" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" disabled>
                <span id="minIntensityValue" class="text-xs text-gray-300 w-12 text-right">N/A</span>
            </div>
            <div class="flex items-center space-x-2">
                <label for="maxIntensitySlider" class="text-xs text-gray-400 w-10">最大:</label>
                <input type="range" id="maxIntensitySlider" class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" disabled>
                <span id="maxIntensityValue" class="text-xs text-gray-300 w-12 text-right">N/A</span>
            </div>
            <button id="otsuButton" class="mt-2 w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-1 px-2 rounded text-xs" disabled>Otsu法で閾値設定</button>
        </div>

        <div class="pt-2 border-t border-gray-700">
            <label for="colorMapSelect" class="block text-sm font-medium text-gray-300">カラーマップ:</label>
            <select id="colorMapSelect" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-600 bg-gray-700 text-gray-200 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                <option value="whiteRed">白-赤 (デフォルト)</option>
                <option value="grayscale">グレースケール</option>
                <option value="rainbow">虹色</option>
                <option value="blueYellowRed">青-黄-赤</option>
            </select>
        </div>

        <div class="space-y-1 pt-2 border-t border-gray-700">
            <label class="block text-sm font-medium text-gray-300">ボクセル化 (Voxel Grid):</label>
            <div class="flex items-center space-x-2">
                <input type="checkbox" id="voxelizeCheckbox" class="h-4 w-4 text-indigo-600 border-gray-500 rounded focus:ring-indigo-500">
                <label for="voxelizeCheckbox" class="text-xs text-gray-400">有効にする</label>
            </div>
            <div class="flex items-center space-x-2 mt-1">
                <label for="voxelSizeInput" class="text-xs text-gray-400 w-16">サイズ:</label>
                <input type="number" id="voxelSizeInput" value="0.1" step="0.01" min="0.01" class="w-full text-xs bg-gray-700 text-gray-200 border-gray-600 rounded-md shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-1" disabled>
            </div>
            <div class="flex items-center space-x-2 mt-1">
                <input type="checkbox" id="displayVoxelsAsCubesCheckbox" class="h-4 w-4 text-indigo-600 border-gray-500 rounded focus:ring-indigo-500" disabled>
                <label for="displayVoxelsAsCubesCheckbox" class="text-xs text-gray-400">ボクセルを立方体で表示</label>
            </div>
        </div>

        <div class="space-y-1 pt-2 border-t border-gray-700">
            <label class="block text-sm font-medium text-gray-300">Octree化 (Region Octree):</label>
            <div class="flex items-center space-x-2">
                <input type="checkbox" id="octreeCheckbox" class="h-4 w-4 text-indigo-600 border-gray-500 rounded focus:ring-indigo-500">
                <label for="octreeCheckbox" class="text-xs text-gray-400">有効 (代表点:重心)</label>
            </div>
            <div class="flex items-center space-x-2 mt-1">
                <label for="octreeDepthInput" class="text-xs text-gray-400 w-16">深さ:</label>
                <input type="number" id="octreeDepthInput" value="4" step="1" min="1" max="10" class="w-full text-xs bg-gray-700 text-gray-200 border-gray-600 rounded-md shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50 p-1" disabled>
            </div>
            <div class="flex items-center space-x-2 mt-1">
                <input type="checkbox" id="displayOctreeBoundsCheckbox" class="h-4 w-4 text-indigo-600 border-gray-500 rounded focus:ring-indigo-500" disabled>
                <label for="displayOctreeBoundsCheckbox" class="text-xs text-gray-400">境界ボックス (実範囲)</label>
            </div>
        </div>

    </div>

    <script type="module">
        let scene, camera, renderer, controls;
        let pointCloudObject = null;
        let octreeBoundsGroup = null;
        let originalPointsData = null;
        let gridHelper, axesHelper;
        let dynamicGridHelper = null;

        let minIntensityGlobal = 0;
        let maxIntensityGlobal = 1;
        let currentMinIntensityFilter = 0;
        let currentMaxIntensityFilter = 1;
        let performCameraAdjustmentOnFileLoad = false;

        let currentColorMap = 'whiteRed';

        let voxelizeEnabled = false;
        let voxelSize = 0.1;
        let displayVoxelsAsCubes = false;

        let octreeEnabled = false;
        let octreeMaxDepth = 4;
        let displayOctreeBounds = false;


        const container = document.getElementById('container');
        const fileInput = document.getElementById('fileInput');
        const pointCountDisplay = document.getElementById('pointCount');
        const pointSizeSlider = document.getElementById('pointSize');
        const pointSizeValueDisplay = document.getElementById('pointSizeValue');
        const loader = document.getElementById('loader');

        const minIntensitySlider = document.getElementById('minIntensitySlider');
        const minIntensityValueDisplay = document.getElementById('minIntensityValue');
        const maxIntensitySlider = document.getElementById('maxIntensitySlider');
        const maxIntensityValueDisplay = document.getElementById('maxIntensityValue');
        const colorMapSelect = document.getElementById('colorMapSelect');
        const otsuButton = document.getElementById('otsuButton'); // Added

        const voxelizeCheckbox = document.getElementById('voxelizeCheckbox');
        const voxelSizeInput = document.getElementById('voxelSizeInput');
        const displayVoxelsAsCubesCheckbox = document.getElementById('displayVoxelsAsCubesCheckbox');

        const octreeCheckbox = document.getElementById('octreeCheckbox');
        const octreeDepthInput = document.getElementById('octreeDepthInput');
        const displayOctreeBoundsCheckbox = document.getElementById('displayOctreeBoundsCheckbox');


        const customAlert = document.getElementById('customAlert');
        const customAlertTitle = document.getElementById('customAlertTitle');
        const customAlertMessage = document.getElementById('customAlertMessage');
        const customAlertClose = document.getElementById('customAlertClose');

        function showAlert(title, message) {
            customAlertTitle.textContent = title;
            customAlertMessage.textContent = message;
            customAlert.classList.add('show');
        }
        customAlertClose.addEventListener('click', () => customAlert.classList.remove('show'));

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);

            camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.up.set(0, 0, 1);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.075;
            controls.screenSpacePanning = true;
            controls.minDistance = 0.01;
            controls.maxDistance = 1000;
            controls.rotateSpeed = 0.7;
            controls.panSpeed = 0.7;
            controls.zoomSpeed = 0.9;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(5, -5, 10);
            scene.add(directionalLight);

            gridHelper = new THREE.GridHelper(100, 100, 0x555555, 0x444444);
            gridHelper.rotation.x = Math.PI / 2;
            scene.add(gridHelper);

            axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            octreeBoundsGroup = new THREE.Group();
            scene.add(octreeBoundsGroup);

            controls.target.set(0,0,0);
            camera.position.set(10, -10, 10);
            camera.lookAt(controls.target);
            controls.update();

            window.addEventListener('resize', onWindowResize, false);
            animate();
            setupEventListeners();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function applyColorMap(normalizedIntensity, mapType) {
            let r, g, b;
            const v = Math.max(0, Math.min(1, normalizedIntensity));

            switch (mapType) {
                case 'grayscale':
                    r = v; g = v; b = v;
                    break;
                case 'rainbow':
                    if (v < 0.25) {
                        r = 0; g = 4 * v; b = 1;
                    } else if (v < 0.5) {
                        r = 0; g = 1; b = 1 - 4 * (v - 0.25);
                    } else if (v < 0.75) {
                        r = 4 * (v - 0.5); g = 1; b = 0;
                    } else {
                        r = 1; g = 1 - 4 * (v - 0.75); b = 0;
                    }
                    break;
                case 'blueYellowRed':
                    if (v < 0.5) {
                        r = v * 2.0;
                        g = v * 2.0;
                        b = (0.5 - v) * 2.0;
                    } else {
                        r = 1.0;
                        g = (1.0 - v) * 2.0;
                        b = 0.0;
                    }
                    break;
                case 'whiteRed':
                default:
                    r = 1.0;
                    g = 1.0 - v;
                    b = 1.0 - v;
                    break;
            }
            return new THREE.Color(
                Math.max(0, Math.min(1, r)),
                Math.max(0, Math.min(1, g)),
                Math.max(0, Math.min(1, b))
            );
        }

        function updateDynamicGridHelper(overallBoundingBox) {
            if (dynamicGridHelper) {
                scene.remove(dynamicGridHelper);
                if (dynamicGridHelper.geometry) dynamicGridHelper.geometry.dispose();
                if (dynamicGridHelper.material) dynamicGridHelper.material.dispose();
                dynamicGridHelper = null;
            }

            if (voxelizeEnabled && displayVoxelsAsCubes && overallBoundingBox && !overallBoundingBox.isEmpty()) {
                const sizeVec = new THREE.Vector3();
                overallBoundingBox.getSize(sizeVec);

                const min = overallBoundingBox.min;
                const max = overallBoundingBox.max;

                const gridMinX = Math.floor(min.x / voxelSize) * voxelSize - voxelSize;
                const gridMaxX = Math.ceil(max.x / voxelSize) * voxelSize + voxelSize;
                const gridSizeX = gridMaxX - gridMinX;
                // const divisionsX = Math.round(gridSizeX / voxelSize); // Not directly used for final grid

                const gridMinY = Math.floor(min.y / voxelSize) * voxelSize - voxelSize;
                const gridMaxY = Math.ceil(max.y / voxelSize) * voxelSize + voxelSize;
                const gridSizeY = gridMaxY - gridMinY;
                // const divisionsY = Math.round(gridSizeY / voxelSize); // Not directly used for final grid

                const finalGridSize = Math.max(gridSizeX, gridSizeY, voxelSize); // Ensure grid is at least one voxel
                const finalDivisions = Math.max(1, Math.round(finalGridSize / voxelSize));


                dynamicGridHelper = new THREE.GridHelper(finalGridSize, finalDivisions, 0x666666, 0x555555);
                dynamicGridHelper.rotation.x = Math.PI / 2;
                // Center the grid approximately under the point cloud
                const center = new THREE.Vector3();
                overallBoundingBox.getCenter(center);
                dynamicGridHelper.position.set(center.x, center.y, 0); // Assuming Z=0 is the ground plane for the grid

                scene.add(dynamicGridHelper);
                gridHelper.visible = false;
            } else {
                gridHelper.visible = true;
            }
        }

        /**
         * Calculates the Otsu threshold for a given set of intensity values.
         * @param {number[]} rawIntensities - Array of intensity values.
         * @param {number} dataMinIntensity - The minimum intensity value in the dataset (for histogram range).
         * @param {number} dataMaxIntensity - The maximum intensity value in the dataset (for histogram range).
         * @param {number} [numBins=256] - Number of bins for the histogram.
         * @returns {object} An object containing the calculated threshold and a message.
         * { threshold: number, message: string }
         */
        function calculateOtsuThreshold(rawIntensities, dataMinIntensity, dataMaxIntensity, numBins = 256) {
            if (rawIntensities.length === 0) {
                return { threshold: dataMinIntensity, message: "点群データが空のため、Otsu法を適用できませんでした。" };
            }

            const firstIntensity = rawIntensities[0];
            const allSame = rawIntensities.every(val => val === firstIntensity);

            if (allSame) {
                return { threshold: firstIntensity, message: `全ての点の強度が同じ (${firstIntensity.toFixed(2)}) です。閾値はこの値に設定されました。` };
            }

            // Ensure dataMinIntensity is strictly less than dataMaxIntensity for histogram creation.
            // This case should ideally be handled by the global min/max intensity calculation logic
            // which ensures maxIntensityGlobal > minIntensityGlobal if points exist and are not all same.
            if (dataMinIntensity >= dataMaxIntensity) {
                 // If, for some reason, they are still equal or inverted after global calculation,
                 // it implies an issue or a very specific dataset (e.g., all points have same intensity,
                 // which is handled by `allSame` check).
                 // As a fallback, return the min intensity.
                console.warn("Otsu: dataMinIntensity >= dataMaxIntensity. Defaulting to dataMinIntensity.", dataMinIntensity, dataMaxIntensity);
                return { threshold: dataMinIntensity, message: "強度の範囲が無効か、全ての点が同じ強度です。" };
            }


            const histogram = new Array(numBins).fill(0);
            const step = (dataMaxIntensity - dataMinIntensity) / numBins;

            for (const intensity of rawIntensities) {
                let binIndex = Math.floor((intensity - dataMinIntensity) / step);
                binIndex = Math.max(0, Math.min(numBins - 1, binIndex)); // Clamp to [0, numBins-1]
                histogram[binIndex]++;
            }

            const totalPixels = rawIntensities.length;

            let sum = 0; // Sum of (binIndex * countInBin)
            for (let i = 0; i < numBins; i++) {
                sum += i * histogram[i];
            }

            let sumB = 0; // Sum of (binIndex * countInBin) for background class
            let wB = 0;   // Weight (pixel count) of background class
            let wF = 0;   // Weight (pixel count) of foreground class
            let maxVariance = 0;
            let thresholdBin = 0;

            for (let t = 0; t < numBins; t++) {
                wB += histogram[t];
                if (wB === 0) continue;

                wF = totalPixels - wB;
                if (wF === 0) break; // All pixels are in background, no foreground

                sumB += t * histogram[t];

                const mB = sumB / wB; // Mean of background
                const mF = (sum - sumB) / wF; // Mean of foreground

                const betweenClassVariance = wB * wF * (mB - mF) * (mB - mF);

                if (betweenClassVariance > maxVariance) {
                    maxVariance = betweenClassVariance;
                    thresholdBin = t;
                }
            }

            // Convert the threshold bin index back to an intensity value.
            // The threshold is typically considered to be at the end of the `thresholdBin`.
            const otsuThresholdValue = dataMinIntensity + (thresholdBin + 1) * step;

            // Clip the threshold to be within the original data's min/max intensity range.
            const clampedThreshold = Math.max(dataMinIntensity, Math.min(dataMaxIntensity, otsuThresholdValue));

            return { threshold: clampedThreshold, message: `Otsu法による閾値: ${clampedThreshold.toFixed(2)}` };
        }


        function setupEventListeners() {
            fileInput.addEventListener('change', (event) => {
                const file = event.target.files[0];
                if (file) {
                    if (file.name.endsWith('.bin')) {
                        loader.style.display = 'block';
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                originalPointsData = new Float32Array(e.target.result);
                                performCameraAdjustmentOnFileLoad = true;
                                processAndDisplayPointCloud();
                            } catch (error) {
                                console.error("Error processing file:", error);
                                showAlert('処理エラー', `ファイルの処理中にエラーが発生しました: ${error.message}`);
                                originalPointsData = null;
                                processAndDisplayPointCloud(); // Clear display and disable UI
                            } finally {
                                loader.style.display = 'none';
                            }
                        };
                        reader.onerror = (error) => {
                            console.error("Error reading file:", error);
                            showAlert('ファイル読み込みエラー', `ファイルの読み込み中にエラーが発生しました: ${error.message}`);
                            loader.style.display = 'none';
                            originalPointsData = null;
                            processAndDisplayPointCloud(); // Clear display and disable UI
                        };
                        reader.readAsArrayBuffer(file);
                    } else {
                        showAlert('ファイルエラー', '無効なファイル形式です。.bin ファイルを選択してください。');
                        fileInput.value = ''; // Reset file input
                        originalPointsData = null;
                        processAndDisplayPointCloud(); // Clear display and disable UI
                    }
                }
            });

            pointSizeSlider.addEventListener('input', (event) => {
                const newSize = parseFloat(event.target.value);
                pointSizeValueDisplay.textContent = newSize.toFixed(2);
                if (pointCloudObject && pointCloudObject.type === 'Points') {
                    pointCloudObject.material.size = newSize;
                }
            });

            minIntensitySlider.addEventListener('input', () => {
                currentMinIntensityFilter = parseFloat(minIntensitySlider.value);
                if (currentMinIntensityFilter > currentMaxIntensityFilter) {
                    currentMaxIntensityFilter = currentMinIntensityFilter;
                    maxIntensitySlider.value = currentMaxIntensityFilter.toFixed(Math.max(2, maxIntensitySlider.step.split('.')[1]?.length || 2));
                    maxIntensityValueDisplay.textContent = currentMaxIntensityFilter.toFixed(2);
                }
                minIntensityValueDisplay.textContent = currentMinIntensityFilter.toFixed(2);
                if (originalPointsData) {
                    performCameraAdjustmentOnFileLoad = false;
                    processAndDisplayPointCloud();
                }
            });

            maxIntensitySlider.addEventListener('input', () => {
                currentMaxIntensityFilter = parseFloat(maxIntensitySlider.value);
                if (currentMaxIntensityFilter < currentMinIntensityFilter) {
                    currentMinIntensityFilter = currentMaxIntensityFilter;
                    minIntensitySlider.value = currentMinIntensityFilter.toFixed(Math.max(2, minIntensitySlider.step.split('.')[1]?.length || 2));
                    minIntensityValueDisplay.textContent = currentMinIntensityFilter.toFixed(2);
                }
                maxIntensityValueDisplay.textContent = currentMaxIntensityFilter.toFixed(2);
                if (originalPointsData) {
                    performCameraAdjustmentOnFileLoad = false;
                    processAndDisplayPointCloud();
                }
            });

            colorMapSelect.addEventListener('change', (event) => {
                currentColorMap = event.target.value;
                if (originalPointsData) {
                    performCameraAdjustmentOnFileLoad = false;
                    processAndDisplayPointCloud();
                }
            });

            otsuButton.addEventListener('click', () => {
                if (!originalPointsData) {
                    showAlert('情報', 'まず点群ファイルをロードしてください。');
                    return;
                }
                loader.style.display = 'block';

                // Use setTimeout to allow the loader to render before potentially heavy computation
                setTimeout(() => {
                    try {
                        const intensities = [];
                        const totalNumPoints = originalPointsData.length / 4;

                        if (totalNumPoints === 0) {
                             showAlert('Otsu法 結果', "点群データが空のため、Otsu法を適用できませんでした。");
                             loader.style.display = 'none';
                             return;
                        }

                        for (let i = 0; i < totalNumPoints; i++) {
                            intensities.push(originalPointsData[i * 4 + 3]);
                        }

                        // minIntensityGlobal and maxIntensityGlobal should be up-to-date from file load
                        const result = calculateOtsuThreshold(intensities, minIntensityGlobal, maxIntensityGlobal);
                        showAlert('Otsu法 結果', result.message);

                        if (typeof result.threshold !== 'number' || isNaN(result.threshold)) {
                            console.error("Otsu threshold calculation failed or returned invalid value.");
                            loader.style.display = 'none';
                            return;
                        }
                        const otsuThreshold = result.threshold;

                        currentMinIntensityFilter = otsuThreshold;
                        // Set max filter to global max to show all points above Otsu's threshold
                        currentMaxIntensityFilter = maxIntensityGlobal;

                        // Update slider UI to reflect the new filter values
                        const minStepDecimalPlaces = minIntensitySlider.step.split('.')[1]?.length || 0;
                        minIntensitySlider.value = currentMinIntensityFilter.toFixed(Math.max(2, minStepDecimalPlaces));
                        minIntensityValueDisplay.textContent = currentMinIntensityFilter.toFixed(2);

                        const maxStepDecimalPlaces = maxIntensitySlider.step.split('.')[1]?.length || 0;
                        maxIntensitySlider.value = currentMaxIntensityFilter.toFixed(Math.max(2, maxStepDecimalPlaces));
                        maxIntensityValueDisplay.textContent = currentMaxIntensityFilter.toFixed(2);

                        performCameraAdjustmentOnFileLoad = false; // Don't readjust camera
                        processAndDisplayPointCloud();

                    } catch (error) {
                        console.error("Error during Otsu thresholding:", error);
                        showAlert('エラー', `Otsu法処理中にエラーが発生しました: ${error.message}`);
                    } finally {
                        loader.style.display = 'none';
                    }
                }, 10); // Small delay for loader visibility
            });


            voxelizeCheckbox.addEventListener('change', (event) => {
                voxelizeEnabled = event.target.checked;
                voxelSizeInput.disabled = !voxelizeEnabled;
                displayVoxelsAsCubesCheckbox.disabled = !voxelizeEnabled;
                pointSizeSlider.disabled = voxelizeEnabled && displayVoxelsAsCubes;
                if (voxelizeEnabled) {
                    octreeCheckbox.checked = false;
                    octreeEnabled = false;
                    octreeDepthInput.disabled = true;
                    displayOctreeBoundsCheckbox.disabled = true;
                    displayOctreeBoundsCheckbox.checked = false;
                }

                if (originalPointsData) {
                    performCameraAdjustmentOnFileLoad = false;
                    processAndDisplayPointCloud();
                } else {
                    updateDynamicGridHelper(null);
                }
            });

            voxelSizeInput.addEventListener('change', (event) => {
                const newSize = parseFloat(event.target.value);
                if (newSize > 0) {
                    voxelSize = newSize;
                    if (originalPointsData && voxelizeEnabled) {
                        performCameraAdjustmentOnFileLoad = false;
                        processAndDisplayPointCloud();
                    }
                } else {
                    showAlert("入力エラー", "ボクセルサイズは0より大きい値を入力してください。");
                    voxelSizeInput.value = voxelSize; // Revert to previous valid size
                }
            });

            displayVoxelsAsCubesCheckbox.addEventListener('change', (event) => {
                displayVoxelsAsCubes = event.target.checked;
                pointSizeSlider.disabled = voxelizeEnabled && displayVoxelsAsCubes;
                if (originalPointsData) {
                    performCameraAdjustmentOnFileLoad = false;
                    processAndDisplayPointCloud();
                } else {
                     updateDynamicGridHelper(null);
                }
            });

            octreeCheckbox.addEventListener('change', (event) => {
                octreeEnabled = event.target.checked;
                octreeDepthInput.disabled = !octreeEnabled;
                displayOctreeBoundsCheckbox.disabled = !octreeEnabled;

                if (octreeEnabled) {
                    voxelizeCheckbox.checked = false;
                    voxelizeEnabled = false;
                    voxelSizeInput.disabled = true;
                    displayVoxelsAsCubesCheckbox.disabled = true;
                    displayVoxelsAsCubesCheckbox.checked = false;
                    pointSizeSlider.disabled = false; // Re-enable point size slider if octree is on
                }
                if (originalPointsData) {
                    performCameraAdjustmentOnFileLoad = false;
                    processAndDisplayPointCloud();
                } else {
                    clearOctreeBounds();
                }
            });
            octreeDepthInput.addEventListener('change', (event) => {
                const newDepth = parseInt(event.target.value, 10);
                if (newDepth >= 1 && newDepth <=10) {
                    octreeMaxDepth = newDepth;
                    if (originalPointsData && octreeEnabled) {
                        performCameraAdjustmentOnFileLoad = false;
                        processAndDisplayPointCloud();
                    }
                } else {
                    showAlert("入力エラー", "Octreeの深さは1から10の間で入力してください。");
                    octreeDepthInput.value = octreeMaxDepth; // Revert
                }
            });
            displayOctreeBoundsCheckbox.addEventListener('change', (event) => {
                displayOctreeBounds = event.target.checked;
                 if (originalPointsData && octreeEnabled) {
                    performCameraAdjustmentOnFileLoad = false;
                    processAndDisplayPointCloud();
                } else if (!octreeEnabled || !originalPointsData) {
                    clearOctreeBounds();
                }
            });
        }

        function clearPointCloudObject() {
            if (pointCloudObject) {
                if (pointCloudObject.type === 'Group') { // For voxel cubes
                    pointCloudObject.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    });
                    pointCloudObject.clear(); // Remove all children
                } else { // For Points object
                    if (pointCloudObject.geometry) pointCloudObject.geometry.dispose();
                    if (pointCloudObject.material) pointCloudObject.material.dispose();
                }
                scene.remove(pointCloudObject);
                pointCloudObject = null;
            }
        }
        function clearOctreeBounds() {
            if (octreeBoundsGroup) {
                octreeBoundsGroup.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                octreeBoundsGroup.clear();
            }
        }


        // --- Octree Node Class and Build Function ---
        class OctreeNode {
            constructor(bounds, depth) {
                this.bounds = bounds;
                this.actualBounds = new THREE.Box3();
                this.depth = depth;
                this.children = null;
                this.sumX = 0; this.sumY = 0; this.sumZ = 0;
                this.sumIntensity = 0; this.pointCount = 0;
            }

            subdivide() {
                this.children = [];
                const min = this.bounds.min;
                const max = this.bounds.max;
                const mid = new THREE.Vector3().addVectors(min, max).multiplyScalar(0.5);

                this.children.push(new OctreeNode(new THREE.Box3(new THREE.Vector3(min.x, min.y, min.z), new THREE.Vector3(mid.x, mid.y, mid.z)), this.depth + 1));
                this.children.push(new OctreeNode(new THREE.Box3(new THREE.Vector3(mid.x, min.y, min.z), new THREE.Vector3(max.x, mid.y, mid.z)), this.depth + 1));
                this.children.push(new OctreeNode(new THREE.Box3(new THREE.Vector3(min.x, mid.y, min.z), new THREE.Vector3(mid.x, max.y, mid.z)), this.depth + 1));
                this.children.push(new OctreeNode(new THREE.Box3(new THREE.Vector3(mid.x, mid.y, min.z), new THREE.Vector3(max.x, max.y, mid.z)), this.depth + 1));
                this.children.push(new OctreeNode(new THREE.Box3(new THREE.Vector3(min.x, min.y, mid.z), new THREE.Vector3(mid.x, mid.y, max.z)), this.depth + 1));
                this.children.push(new OctreeNode(new THREE.Box3(new THREE.Vector3(mid.x, min.y, mid.z), new THREE.Vector3(max.x, mid.y, max.z)), this.depth + 1));
                this.children.push(new OctreeNode(new THREE.Box3(new THREE.Vector3(min.x, mid.y, mid.z), new THREE.Vector3(mid.x, max.y, max.z)), this.depth + 1));
                this.children.push(new OctreeNode(new THREE.Box3(new THREE.Vector3(mid.x, mid.y, mid.z), new THREE.Vector3(max.x, max.y, max.z)), this.depth + 1));
            }

            insert(point) {
                this.actualBounds.expandByPoint(new THREE.Vector3(point.x, point.y, point.z));
                this.sumX += point.x; this.sumY += point.y; this.sumZ += point.z;
                this.sumIntensity += point.intensity; this.pointCount++;

                if (this.depth < octreeMaxDepth) {
                    if (this.children === null) {
                        this.subdivide();
                    }
                    const pointVec = new THREE.Vector3(point.x, point.y, point.z);
                    let insertedInChildren = false;
                    for (let i = 0; i < 8; i++) {
                        if (this.children[i].bounds.containsPoint(pointVec)) {
                            this.children[i].insert(point);
                            insertedInChildren = true;
                            break;
                        }
                    }
                }
            }

            getLeafRepresentativePoints(representatives) {
                if (this.depth === octreeMaxDepth || this.children === null) {
                    if (this.pointCount > 0) {
                        representatives.push({
                            x: this.sumX / this.pointCount,
                            y: this.sumY / this.pointCount,
                            z: this.sumZ / this.pointCount,
                            intensity: this.sumIntensity / this.pointCount,
                        });
                    }
                } else {
                    for (let i = 0; i < 8; i++) {
                        if (this.children[i].pointCount > 0) { // Only recurse if child has points
                           this.children[i].getLeafRepresentativePoints(representatives);
                        }
                    }
                }
            }

            getDisplayableNodeActualBounds(boundsList) {
                if (this.pointCount > 0) { // Only consider nodes that actually received points
                    if (this.depth === octreeMaxDepth || this.children === null) {
                        if (!this.actualBounds.isEmpty()) {
                            boundsList.push(this.actualBounds);
                        }
                    } else if (this.children !== null) {
                        for (let i = 0; i < 8; i++) {
                             this.children[i].getDisplayableNodeActualBounds(boundsList);
                        }
                    }
                }
            }
        }


        function processAndDisplayPointCloud() {
            // Update Otsu button state
            if (originalPointsData && originalPointsData.length > 0) {
                otsuButton.disabled = false;
            } else {
                otsuButton.disabled = true;
            }

            if (!originalPointsData) {
                pointCountDisplay.textContent = `点群数: 0 (表示中: 0)`;
                minIntensitySlider.disabled = true; maxIntensitySlider.disabled = true;
                minIntensityValueDisplay.textContent = "N/A"; maxIntensityValueDisplay.textContent = "N/A";
                colorMapSelect.disabled = true; // Disable if no data

                voxelizeCheckbox.disabled = true; voxelizeCheckbox.checked = false;
                voxelSizeInput.disabled = true;
                displayVoxelsAsCubesCheckbox.disabled = true; displayVoxelsAsCubesCheckbox.checked = false;
                octreeCheckbox.disabled = true; octreeCheckbox.checked = false;
                octreeDepthInput.disabled = true;
                displayOctreeBoundsCheckbox.disabled = true; displayOctreeBoundsCheckbox.checked = false;
                pointSizeSlider.disabled = false; // Default state

                voxelizeEnabled = false; displayVoxelsAsCubes = false; octreeEnabled = false; displayOctreeBounds = false;

                clearPointCloudObject();
                clearOctreeBounds();
                updateDynamicGridHelper(null);
                // Reset camera to default if no data
                controls.target.set(0,0,0);
                camera.position.set(10, -10, 10);
                camera.lookAt(controls.target);
                controls.update();
                return;
            }

            loader.style.display = 'block';
            camera.up.set(0,0,1); // Ensure Z is up

            // UI Enable/Disable Logic based on current state
            minIntensitySlider.disabled = false;
            maxIntensitySlider.disabled = false;
            colorMapSelect.disabled = false;

            voxelizeCheckbox.disabled = octreeEnabled; // Can't use both
            voxelSizeInput.disabled = !voxelizeEnabled || octreeEnabled;
            displayVoxelsAsCubesCheckbox.disabled = !voxelizeEnabled || octreeEnabled;

            octreeCheckbox.disabled = voxelizeEnabled; // Can't use both
            octreeDepthInput.disabled = !octreeEnabled || voxelizeEnabled;
            displayOctreeBoundsCheckbox.disabled = !octreeEnabled || voxelizeEnabled;

            pointSizeSlider.disabled = (voxelizeEnabled && displayVoxelsAsCubes);


            const float32Array = originalPointsData;
            if (float32Array.length % 4 !== 0) {
                showAlert('ファイルエラー', 'ファイルのデータ形式が正しくありません (x,y,z,intensity の組であるべきです)。');
                loader.style.display = 'none';
                return;
            }

            const totalNumPoints = float32Array.length / 4;

            if (performCameraAdjustmentOnFileLoad) {
                minIntensityGlobal = Infinity;
                maxIntensityGlobal = -Infinity;
                if (totalNumPoints > 0) {
                    for (let i = 0; i < totalNumPoints; i++) {
                        const intensityVal = float32Array[i * 4 + 3];
                        if (intensityVal < minIntensityGlobal) minIntensityGlobal = intensityVal;
                        if (intensityVal > maxIntensityGlobal) maxIntensityGlobal = intensityVal;
                    }
                } else { // No points
                    minIntensityGlobal = 0;
                    maxIntensityGlobal = 1;
                }

                if (minIntensityGlobal === maxIntensityGlobal) { // All points have same intensity or no points
                     maxIntensityGlobal = minIntensityGlobal + (minIntensityGlobal === 0 ? 1.0 : Math.abs(minIntensityGlobal * 0.1) + 0.1);
                     if (minIntensityGlobal === maxIntensityGlobal && totalNumPoints > 0) maxIntensityGlobal +=1.0; // Ensure different if single intensity
                     else if (totalNumPoints === 0) maxIntensityGlobal = 1.0; // Default for no points
                }


                minIntensitySlider.min = minIntensityGlobal.toFixed(2);
                minIntensitySlider.max = maxIntensityGlobal.toFixed(2);
                minIntensitySlider.value = minIntensityGlobal.toFixed(2);
                minIntensityValueDisplay.textContent = minIntensityGlobal.toFixed(2);
                currentMinIntensityFilter = minIntensityGlobal;

                maxIntensitySlider.min = minIntensityGlobal.toFixed(2);
                maxIntensitySlider.max = maxIntensityGlobal.toFixed(2);
                maxIntensitySlider.value = maxIntensityGlobal.toFixed(2);
                maxIntensityValueDisplay.textContent = maxIntensityGlobal.toFixed(2);
                currentMaxIntensityFilter = maxIntensityGlobal;

                const stepValue = Math.max(0.01, (maxIntensityGlobal - minIntensityGlobal) / 100);
                minIntensitySlider.step = stepValue.toFixed(Math.max(2, stepValue.toString().split('.')[1]?.length || 0));
                maxIntensitySlider.step = stepValue.toFixed(Math.max(2, stepValue.toString().split('.')[1]?.length || 0));
            }

            let pointsToProcess = [];
            for (let i = 0; i < totalNumPoints; i++) {
                const intensityVal = float32Array[i * 4 + 3];
                if (intensityVal >= currentMinIntensityFilter && intensityVal <= currentMaxIntensityFilter) {
                    pointsToProcess.push({
                        x: float32Array[i * 4 + 0],
                        y: float32Array[i * 4 + 1],
                        z: float32Array[i * 4 + 2],
                        intensity: intensityVal
                    });
                }
            }

            let finalPositionsArray = [];
            let finalIntensitiesArray = [];
            let voxelGridData = []; // For displaying voxels as cubes
            let rootNodeForOctree = null;

            clearOctreeBounds(); // Clear previous bounds visuals

            if (octreeEnabled && pointsToProcess.length > 0) {
                const overallBounds = new THREE.Box3();
                pointsToProcess.forEach(p => overallBounds.expandByPoint(new THREE.Vector3(p.x, p.y, p.z)));

                if (!overallBounds.isEmpty()) {
                    rootNodeForOctree = new OctreeNode(overallBounds.clone(), 0); // Use clone for safety
                    pointsToProcess.forEach(p => rootNodeForOctree.insert(p));

                    const representativePoints = [];
                    rootNodeForOctree.getLeafRepresentativePoints(representativePoints);

                    representativePoints.forEach(rp => {
                        finalPositionsArray.push(rp.x, rp.y, rp.z);
                        finalIntensitiesArray.push(rp.intensity);
                    });

                    if (displayOctreeBounds) {
                        const boundsToDisplay = [];
                        rootNodeForOctree.getDisplayableNodeActualBounds(boundsToDisplay);
                        boundsToDisplay.forEach(box => {
                            if (!box.isEmpty()){
                                const helper = new THREE.Box3Helper(box, 0xcccccc); // Light gray color for bounds
                                octreeBoundsGroup.add(helper);
                            }
                        });
                    }
                }
            } else if (voxelizeEnabled && pointsToProcess.length > 0) {
                const voxels = new Map(); // Map to store voxel data { sumIntensity, count, voxelIndices }
                const invVoxelSize = 1.0 / voxelSize;

                pointsToProcess.forEach(p => {
                    const voxelXIndex = Math.floor(p.x * invVoxelSize);
                    const voxelYIndex = Math.floor(p.y * invVoxelSize);
                    const voxelZIndex = Math.floor(p.z * invVoxelSize);
                    const voxelKey = `${voxelXIndex}_${voxelYIndex}_${voxelZIndex}`;

                    if (!voxels.has(voxelKey)) {
                        voxels.set(voxelKey, { sumIntensity: 0, count: 0, voxelXIndex, voxelYIndex, voxelZIndex });
                    }
                    const voxelEntry = voxels.get(voxelKey);
                    voxelEntry.sumIntensity += p.intensity;
                    voxelEntry.count++;
                });

                voxels.forEach(voxelEntry => {
                    const avgIntensity = voxelEntry.sumIntensity / voxelEntry.count;
                    const cubeCenterX = (voxelEntry.voxelXIndex + 0.5) * voxelSize;
                    const cubeCenterY = (voxelEntry.voxelYIndex + 0.5) * voxelSize;
                    const cubeCenterZ = (voxelEntry.voxelZIndex + 0.5) * voxelSize;

                    if (displayVoxelsAsCubes) {
                        voxelGridData.push({ x: cubeCenterX, y: cubeCenterY, z: cubeCenterZ, intensity: avgIntensity });
                    } else {
                        finalPositionsArray.push(cubeCenterX, cubeCenterY, cubeCenterZ);
                        finalIntensitiesArray.push(avgIntensity);
                    }
                });
            } else { // No octree, no voxelization, or no points to process for them
                pointsToProcess.forEach(p => {
                    finalPositionsArray.push(p.x, p.y, p.z);
                    finalIntensitiesArray.push(p.intensity);
                });
            }

            const numVisibleElements = (voxelizeEnabled && displayVoxelsAsCubes) ? voxelGridData.length : finalPositionsArray.length / 3;
            pointCountDisplay.textContent = `点群数: ${totalNumPoints.toLocaleString()} (表示中: ${numVisibleElements.toLocaleString()})`;

            clearPointCloudObject(); // Clear existing points/cubes

            // Check if there's anything to display before proceeding
            if (numVisibleElements === 0 && !(octreeEnabled && displayOctreeBounds && octreeBoundsGroup.children.length > 0)) {
                updateDynamicGridHelper(null); // Clear dynamic grid if nothing to show
                loader.style.display = 'none';
                controls.update(); // Ensure controls are responsive
                return;
            }

            let geometry; // Will hold BufferGeometry or an object with boundingSphere for camera adjustment
            let overallBoundingBox = new THREE.Box3(); // To calculate overall bounds for camera and grid

            if (voxelizeEnabled && displayVoxelsAsCubes) {
                pointCloudObject = new THREE.Group(); // Group for cube meshes
                const cubeGeometry = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize); // Reusable geometry

                voxelGridData.forEach(voxel => {
                    const normIntensity = Math.max(0, Math.min(1, (voxel.intensity - minIntensityGlobal) / (maxIntensityGlobal - minIntensityGlobal || 1)));
                    const color = applyColorMap(normIntensity, currentColorMap);

                    // Create a new material for each cube to have different colors
                    const cubeMaterial = new THREE.MeshStandardMaterial({
                        color: color,
                        roughness: 0.8,
                        metalness: 0.0,
                        // wireframe: true // Optional: for debugging voxel shapes
                    });
                    const cubeMesh = new THREE.Mesh(cubeGeometry, cubeMaterial);
                    cubeMesh.position.set(voxel.x, voxel.y, voxel.z);
                    pointCloudObject.add(cubeMesh);
                    overallBoundingBox.expandByObject(cubeMesh); // Expand bounds by each cube
                });
                scene.add(pointCloudObject);

                // For camera adjustment, get bounding sphere of the group
                if (pointCloudObject.children.length > 0 && !overallBoundingBox.isEmpty()) {
                     geometry = { boundingSphere: new THREE.Sphere() }; // Mock geometry object
                     overallBoundingBox.getBoundingSphere(geometry.boundingSphere);
                } else {
                    geometry = null; // No geometry if no cubes
                }

            } else if (finalPositionsArray.length > 0) { // Display as points
                const finalPositions = new Float32Array(finalPositionsArray);
                const finalColors = new Float32Array(numVisibleElements * 3); // RGB for each point

                // Use consistent normalization range for colors based on global min/max
                let normMin = minIntensityGlobal;
                let normMax = maxIntensityGlobal;
                if (normMin === normMax) { // Avoid division by zero if all intensities are same
                     normMax = normMin + (normMin === 0 ? 1.0 : Math.abs(normMin * 0.1) + 0.1);
                     if (normMin === normMax) normMax +=1.0;
                }


                for (let i = 0; i < numVisibleElements; i++) {
                    const normIntensity = Math.max(0, Math.min(1, (finalIntensitiesArray[i] - normMin) / (normMax - normMin)));
                    const color = applyColorMap(normIntensity, currentColorMap);
                    finalColors[i * 3 + 0] = color.r;
                    finalColors[i * 3 + 1] = color.g;
                    finalColors[i * 3 + 2] = color.b;
                }

                geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(finalPositions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(finalColors, 3));

                if (numVisibleElements > 0) {
                    geometry.computeBoundingBox(); // For camera adjustment
                    overallBoundingBox.copy(geometry.boundingBox); // Update overall bounds
                    geometry.computeBoundingSphere(); // For camera adjustment
                }


                const material = new THREE.PointsMaterial({
                    size: parseFloat(pointSizeSlider.value),
                    vertexColors: true,
                    sizeAttenuation: true // Points get smaller further away
                });

                pointCloudObject = new THREE.Points(geometry, material);
                scene.add(pointCloudObject);
            }

            // If Octree bounds are displayed, union their extent with the overall bounding box
            if (octreeEnabled && displayOctreeBounds && rootNodeForOctree) {
                const octreeVisualBounds = new THREE.Box3();
                octreeBoundsGroup.children.forEach(helper => {
                    if (helper.box) octreeVisualBounds.union(helper.box); // Box3Helper stores its box
                });
                if(!octreeVisualBounds.isEmpty()){
                    overallBoundingBox.union(octreeVisualBounds);
                } else if (rootNodeForOctree.actualBounds && !rootNodeForOctree.actualBounds.isEmpty() && overallBoundingBox.isEmpty()) {
                    // Fallback if no helpers but root has bounds (e.g. depth 0 and bounds displayed)
                    overallBoundingBox.copy(rootNodeForOctree.actualBounds);
                } else if (rootNodeForOctree.bounds && !rootNodeForOctree.bounds.isEmpty() && overallBoundingBox.isEmpty()) {
                    // Further fallback to theoretical bounds if actual are also empty
                    overallBoundingBox.copy(rootNodeForOctree.bounds);
                }

                // If only octree bounds are visible (no points/cubes), ensure 'geometry' for camera adjustment
                if ((!pointCloudObject || (pointCloudObject.children && pointCloudObject.children.length === 0)) && !overallBoundingBox.isEmpty()) {
                    geometry = { boundingSphere: new THREE.Sphere() };
                    overallBoundingBox.getBoundingSphere(geometry.boundingSphere);
                }
            }


            updateDynamicGridHelper(overallBoundingBox); // Update grid based on final displayed content

            if (performCameraAdjustmentOnFileLoad && geometry && geometry.boundingSphere && (numVisibleElements > 0 || (octreeEnabled && displayOctreeBounds && octreeBoundsGroup.children.length > 0)) && !geometry.boundingSphere.isEmpty()) {
                const center = geometry.boundingSphere.center;
                const radius = geometry.boundingSphere.radius;

                controls.target.copy(center);
                const fov = camera.fov * (Math.PI / 180);
                // Calculate distance to fit the sphere in view
                let camDistance = Math.max(
                    radius / Math.sin(fov / 2) * 1.1, // Factor for some padding
                    radius + controls.minDistance + 0.2,  // Ensure minDistance is respected
                    0.5 // Minimum camera distance fallback
                );
                if (radius < 0.1 && camDistance < 1.0) { // For very small point clouds
                    camDistance = Math.max(camDistance, 1.0);
                }


                // Set camera position relative to the center
                // Using a consistent offset direction for predictability
                const offsetFactor = camDistance * 0.5; // Arbitrary factor for a nice diagonal view
                camera.position.set(
                    center.x + offsetFactor,
                    center.y - offsetFactor,
                    center.z + offsetFactor
                );


                // Sanity check for camera position if it ends up too close or inside
                if (camera.position.distanceTo(center) < radius * 1.05 || (totalNumPoints === 1 && radius < 0.1) ) {
                    const fallbackDist = Math.max(radius * 1.5, 0.5); // Ensure it's outside
                    camera.position.set(center.x + fallbackDist, center.y - fallbackDist, center.z + fallbackDist);
                }

                camera.lookAt(controls.target);
                performCameraAdjustmentOnFileLoad = false; // Only adjust once per file load
            } else if (performCameraAdjustmentOnFileLoad && (numVisibleElements === 0 || (geometry && geometry.boundingSphere && geometry.boundingSphere.isEmpty()))) {
                // If file loaded but no points are visible (e.g., all filtered out initially) or empty geometry
                 controls.target.set(0,0,0);
                 camera.position.set(10, -10, 10); // Reset to default view
                 camera.lookAt(controls.target);
                 performCameraAdjustmentOnFileLoad = false;
            }
            controls.update();
            loader.style.display = 'none';
        }
        init();
    </script>

この更新により、Otsu法を用いた閾値の自動設定が可能になり、特定の高強度な特徴を持つ点群の解析が容易になるはずです。もし何か不具合や、さらに改善したい点があれば教えてくだ
